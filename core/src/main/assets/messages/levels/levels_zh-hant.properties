levels.level.chasm_desc=你看不到底。
levels.level.water_desc=著火時踏進水裡即可滅火。
levels.level.entrance_desc=通向上一層的樓梯。
levels.level.exit_desc=通向下一層的樓梯。
levels.level.embers_desc=灰燼覆蓋著地板。
levels.level.high_grass_desc=茂密的植被阻擋了視線。
levels.level.locked_door_desc=這門被鎖上了，你需要匹配的鑰匙來打開。
levels.level.crystal_door_desc=這扇上鎖的門是由魔法水晶製成的。你甚至能看到對面，但你還是需要一把水晶鑰匙才能打開它。
levels.level.locked_exit_desc=沉重的鐵欄杆封鎖住了下樓樓梯。
levels.level.barricade_desc=木柵欄依然堅固，但早已風乾多年。燒了怎麼樣?
levels.level.inactive_trap_desc=這個陷阱已經被觸發過了，現在一點也不危險。
levels.level.statue_desc=有人想裝飾一下這裡，但很顯然這裝飾實在是爛透了。
levels.level.alchemy_desc=這口煉金釜中充滿了魔力之水。 物品可以在裡面共鍊以製造新的物品。
levels.level.empty_well_desc=這座井已經枯竭了。

levels.level$feeling.chasm_title=空洞樓層
levels.level$feeling.water_title=含水樓層
levels.level$feeling.grass_title=繁茂樓層
levels.level$feeling.dark_title=暗黑樓層
levels.level$feeling.large_title=大型樓層
levels.level$feeling.traps_title=陷阱樓層
levels.level$feeling.secrets_title=神秘樓層
levels.level$feeling.chasm_desc=你的腳步聲迴盪在虛空中。
levels.level$feeling.water_desc=你聽見周圍水花的聲音。
levels.level$feeling.grass_desc=空氣中瀰漫著濃郁的植物清香。
levels.level$feeling.dark_desc=你依稀能聽到敵人在黑暗中潛伏。
levels.level$feeling.large_desc=這一層的規模貌似格外龐大。
levels.level$feeling.traps_desc=這一層的地面上機關密布，殺意凜然。
levels.level$feeling.secrets_desc=詭異的氣氛正暗示這層隱藏著很多祕密。

levels.mininglevel.wall_desc=這裡光滑的岩壁比上面的更軟一些。你可以用你的礦鎬挖它，但這需要些花些體力，飢餓值也會明顯提升。
levels.mininglevel.gold_extra_desc=你或許可以用礦鎬把它挖出來。
levels.mininglevel.crystal_name=水晶尖刺
levels.mininglevel.boulder_name=岩礫
levels.mininglevel.crystal_desc=這裡冒出了一塊巨大的水晶，這種脆弱的物質只要被礦鎬挖掘或鄰近的東西被破壞就會被粉碎。
levels.mininglevel.boulder_desc=這塊巨大的石塊擋住了去路。用礦鎬應該能把它輕易弄碎。
levels.mininglevel.barricade_desc=這些木頭被牢固的固定在礦坑中支撐著。\n\n這些或許是豺狼人建來防止落石嚴重坍方的。_在其附近的落石都會失效。_\n\n像其它木製品一樣，這些支柱應該是易燃物。


levels.sewerlevel.water_name=渾濁水潭
levels.sewerlevel.empty_deco_desc=潮濕的黃綠色苔蘚覆蓋著地板。
levels.sewerlevel.bookshelf_desc=這個書架塞滿了沒用的成功學書籍。燒掉怎麼樣?
levels.sewerlevel.region_deco_name=儲物木桶
levels.sewerlevel.region_deco_desc=高度過肩的木桶。用盡力氣也無法推動，感覺裡面裝滿了東西。
